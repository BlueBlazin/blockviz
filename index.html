<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Explore any codebase as nested architecture diagrams you can zoom into. Runs locally in your browser with Rust and WebAssembly." />
    <!-- Light or dark as the reader chose (src/ui/scheme.ts), before the page is first drawn. -->
    <script>try { const s = localStorage.getItem("blockviz.scheme"); if (s === "light" || s === "dark") document.documentElement.dataset.scheme = s; } catch {}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>blockviz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
