[package]
name = "blockviz-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blockviz"
path = "src/bin/blockviz.rs"

[dependencies]
# Ruff's parser: maintained by Astral, error-tolerant, current with the latest Python grammar.
ruff_python_parser = "=0.0.17"
ruff_python_ast = "=0.0.17"
ruff_text_size = "=0.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
regex-lite = "0.1"
oxc_parser = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_allocator = "=0.153.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"
# Rust: syn parses whole files; span locations give byte offsets into them.
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types"]
