[package]
name = "blockviz-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
blockviz-core = { path = "../blockviz-core" }
# Shaders are compiled as the app starts: building them ahead needs Xcode's separate Metal Toolchain.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Receiving new analyses from the thread that makes them.
futures = "0.3"
# Watching the folder for changes (FSEvents on macOS).
notify = "8.2"
# Moving through the search field by character, as a reader sees characters.
unicode-segmentation = "1"

[dev-dependencies]
# Draws windows headlessly in tests, with simulated input.
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }

# Its own workspace: GPUI is a large build that the web app's tests and CI never need.
[workspace]

[profile.release]
debug = "line-tables-only"
